  - >-
    Selection uses the combined 15,800-window validation population: 3,660
    frozen v2 windows plus 12,140 expanded v5 windows.
  - >-
    At the combined threshold, frozen-v2 F1 is 0.8700683850604944 and
    expanded-v5 F1 is 0.9498393181500628.
  - >-
    Published comparison models remain available on Drive: native-224 SigLIP
    v5_siglip_base_f4_avg_h224w224_step4s2_lr1e4_blr5e6_20260719 and 512x512
    ResNet-50 v5_resnet50_f4_avg_h512w512_step4s2_ra2m5_shared_drop01_20260718.
  - The stored source JPEGs use the current 1024-pixel-long-edge extraction contract.
  - Use threshold 0.5 for argmax-style visual review; use the listed threshold for leaderboard reporting.
  - The beach-domain production selection is a PyTorch checkpoint and does not yet have ONNX/TensorRT publication artifacts.
  - The classifier validation threshold and full-video temporal gate threshold serve different purposes and must not be interchanged.

